name: tests

"on":
  push:
  pull_request:

# Invariantes (Hardening Fase 3, T3): zero chamadas a API externa, zero
# segredos, zero dados pessoais. A suite roda 100% offline — conftest.py
# substitui embed()/embed_one() por um fake determinístico (sem rede, sem
# sentence-transformers/torch) para toda a suite, verificado empiricamente
# antes deste workflow existir. requirements-test.txt é deliberadamente
# menor que requirements.txt (app completo): sem sentence-transformers
# (baixa modelo, ~90MB) nem faiss-cpu (não exercitado pelos testes).

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

      # Dívida #8 (retry/backoff em PermissionError no os.replace) só
      # morde de verdade em Windows — WinError 32 não existe em POSIX.
      - name: Run Windows-only tests
        run: python -m pytest tests/ -m windows_only -q
